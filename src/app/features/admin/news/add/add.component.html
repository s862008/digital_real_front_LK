<div class="news-form">
  <form [formGroup]="addNewsForm" class="container">
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Заголовок</mat-label>
        <input matInput formControlName="title" name="name">
      </mat-form-field>
    </div>
    <div class="row mb-4 p-3">
      <div class="upload-file">
        <input class="btn btn-primary" type="file" (change)="onFileSelected($event)" accept="image/png,image/jpeg"/>
        <span>Выберите картинку для новости в формате JPG, PNG 5Мб</span>
        @if (photoInvalid) {
          <span class="alert alert-danger">Размер картинки не должен превишать 5Мб</span>
        }
        @if (imagePreview) {
          <img [src]="imagePreview" class="photo" alt="News image">
        }
      </div>
    </div>
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Описание новости</mat-label>
        <textarea formControlName="description" matInput></textarea>
      </mat-form-field>
    </div>
    <div class="row">
      <div class="d-flex justify-content-end">
        <button mat-raised-button type="submit" (click)="submit()" class="mat-raised-button-primary-color">
          {{ newsId ? 'Сохранить' : 'Создать' }}
        </button>
      </div>
    </div>
  </form>
</div>
